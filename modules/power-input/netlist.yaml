# Машиночитаемая схема силового ввода. Источник: v8.0 §4.4.4, §5.1.
id: NETLIST-power-input
nets:
  L_pre_ntc:   {description: "L от C14 до NTC", terminal_block: 1, pins: [1b, 1c]}
  L_post_ntc:  {description: "L после NTC", terminal_block: 2, pins: [2a, 2b, 2c]}
  N:           {description: "нейтраль", terminal_block: 3, pins: [3a, 3b, 3c]}
  PE:          {description: "защитная земля, транзит без клеммы", from: c14.PE, to: psu.FG}
pins:
  1a: {net: null, note: "резерв, рычаг закрыт"}
  1b: {net: L_pre_ntc, connects: "c14.L_LOAD (обход по плоскости стенки)"}
  1c: {net: L_pre_ntc, connects: ntc.lead1}
  2a: {net: L_post_ntc, connects: ntc.lead2}
  2b: {net: L_post_ntc, connects: "psu.L (подъём по центру лицевой грани из канала)"}
  2c: {net: L_post_ntc, connects: mov.lead1}
  3a: {net: N, connects: mov.lead2}
  3b: {net: N, connects: "psu.N (подъём справа из канала)"}
  3c: {net: N, connects: "c14.N_LOAD (вход над якорем)"}
components:
  ntc: {ref: CMP-ntc-5d-15, in_series_with: L, disc_rotation_deg: 45, tilt: "вверх-наружу 30–45°"}
  mov: {ref: CMP-mov-10d471k, between: [L_post_ntc, N], disc_rotation_deg: -45, tilt: none}
  c14: {ref: CMP-dl-1dz2kr}
  psu: {ref: CMP-meanwell-lrs-100-24}
  holder: {ref: CMP-holder-wago-asa}
conductors:
  - {from: c14.L_LOAD, to: "1b", wire: ПВ3 0.75 коричневый, end_a: "клемма «мама» 6.3", end_b: "голая жила в WAGO"}
  - {from: c14.N_LOAD, to: "3c", wire: ПВ3 0.75 синий,     end_a: "клемма «мама» 6.3", end_b: "голая жила в WAGO"}
  - {from: c14.PE,     to: psu.FG, wire: ПВ3 0.75 жёлто-зелёный, end_a: "клемма «мама» 6.3", end_b: "НШВИ", note: "длиннее L/N на 2–3 см"}
  - {from: "2b", to: psu.L, wire: ПВ3 0.75 коричневый, end_a: "голая жила в WAGO", end_b: НШВИ}
  - {from: "3b", to: psu.N, wire: ПВ3 0.75 синий,     end_a: "голая жила в WAGO", end_b: НШВИ}
invariants:
  - "PE не проходит через держатель WAGO"
  - "NTC строго последовательно в L после выключателя C14"
  - "MOV между L после NTC и N"
