# Жгуты. Источник: v8.0 §5.2–5.4, §4.5, §5 BOM (поз. 53–64).
power_24v:
  - {id: H-24V-POS, from: "psu.+V", via: [CMP-ruef400, "ferrite clip-on"], to: "jab4.V+", color: красный}
  - {id: H-24V-NEG, from: "psu.-V", to: "jab4.GND", color: чёрный}
signals:
  - {id: H-AUX,  from: CMP-jack-3-5-panel, via: "PolySwitch 0.1 А в разрыв GND", to: "jab4.AUX", cable: "экранированный микрофонный", colors: {left: белый, right: красный, ground: оплётка}}
  - {id: H-VOL,  from: CMP-pot-10k-linear, to: "jab4.ADC0 / +3.3V / GND", cable: экранированный, colors: {"+3.3V": красный, ADC: белый, GND: оплётка}}
acoustic:
  power_bundle:
    feedthrough: FT-power
    terminal_blocks: [TB-bass, TB-treble]
    wires:
      - {id: W-BASS-P, section_mm2: 1.5, color: красный, length_m: 0.5, to: "woofer+", lug: "НВИ 2-4"}
      - {id: W-BASS-N, section_mm2: 1.5, color: чёрный,  length_m: 0.5, to: "woofer−", lug: "НВИ 2-4"}
      - {id: W-TWL-P,  section_mm2: 1.0, color: жёлтый,  length_m: 0.5, to: "tweeter L+", lug: "НВИ 1.25-3"}
      - {id: W-TWL-N,  section_mm2: 1.0, color: чёрный,  length_m: 0.6, to: "tweeter L−", tag: "L−", lug: "НВИ 1.25-3"}
      - {id: W-TWR-P,  section_mm2: 1.0, color: синий,   length_m: 0.6, to: "tweeter R+", lug: "НВИ 1.25-3"}
      - {id: W-TWR-N,  section_mm2: 1.0, color: чёрный,  length_m: 0.6, to: "tweeter R−", tag: "R−", lug: "НВИ 1.25-3"}
  signal_bundle:
    feedthrough: FT-signal
    terminal_blocks: [TB-signal]
    wires:
      - {id: W-LED-P, section_mm2: 0.5, color: оранжевый, length_m: 0.5, to: "LED+ (через резистор 2.7 кОм к +24 В)"}
      - {id: W-LED-N, section_mm2: 0.5, color: чёрный,    length_m: 0.5, to: "LED−", tag: "LED−"}
routing:
  - "Жгуты по дну акустического отсека, стяжки с самоклеящимися площадками, до нижнего мата"
  - "Проходки залить PU-40 со стороны электроники; клеевая термоусадка ∅10–12 на участках прохода"
