# Источник истины по DSP. Источник: v8.0 §8.2.
id: DSP-params
tool: {name: SigmaStudio, versions: ["4.6", "4.7"], target: ADAU1701}
volume:
  block: "External Volume, Single/Gain (Type 2)"
  control: {block: "Aux ADC Input", channel: ADC0}
crossover_hz: 2500
channels:
  tweeter_left:
    out: DAC0
    chain:
      - {block: hpf, type: Butterworth, slope_db_oct: 24, freq_hz: 2500}   # 2 каскада 2-го порядка (OQ-003)
      - {block: gain, value_db: -8.0}
      - {block: limiter, threshold_db: -3.0, release_ms: 50}
  tweeter_right:
    out: DAC1
    chain:
      - {block: hpf, type: Butterworth, slope_db_oct: 24, freq_hz: 2500}
      - {block: gain, value_db: -8.0}
      - {block: limiter, threshold_db: -3.0, release_ms: 50}
  sub_mono:
    out: [DAC2, DAC3]
    dac3_invert: true
    chain:
      - {block: merger, inputs: 2}
      - {block: hpf_subsonic, type: Butterworth, slope_db_oct: 24, freq_hz: 60}
      - {block: peq, type: peaking, freq_hz: 95, gain_db: -4.0, q: 1.2}
      - {block: low_shelf, freq_hz: 300, gain_db: 3.0, q: 0.7}
      - {block: lpf, type: Butterworth, slope_db_oct: 24, freq_hz: 2500}
      - {block: limiter, threshold_db: -3.0, release_ms: 150}
notes:
  - "Подъём 45 Гц эквалайзером не применять (перегрузка диффузора, клиппинг усилителя)"
  - "Верифицировать АЧХ измерением после сборки; значения PEQ/shelf — стартовые"
verified_by_measurement: false
