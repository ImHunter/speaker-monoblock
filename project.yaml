# Манифест проекта. Статусы модулей: draft | reviewed | frozen | built | tested
project:
  id: speaker-monoblock
  name: Активная колонка-моноблок
  version: "8.0"
  source_revision_date: 2026-09-22
  started: 2026-07-25
  authors: [Мастер, Инженер]
  language: ru

modules:
  enclosure:
    path: modules/enclosure
    status: draft
    depends_on: []
  acoustics:
    path: modules/acoustics
    status: draft
    depends_on: [enclosure]
  power-input:
    path: modules/power-input
    status: draft          # самый проработанный (ревизия 4); после проверки человеком → reviewed/frozen
    depends_on: [enclosure, shielding-grounding]
  shielding-grounding:
    path: modules/shielding-grounding
    status: draft
    depends_on: [enclosure]
  amplifier-mount:
    path: modules/amplifier-mount
    status: draft
    depends_on: [enclosure, shielding-grounding]
  indicator:
    path: modules/indicator
    status: draft
    depends_on: [enclosure]
  wiring:
    path: modules/wiring
    status: draft
    depends_on: [enclosure, power-input, amplifier-mount]
  dsp:
    path: modules/dsp
    status: draft
    depends_on: [acoustics, amplifier-mount]

stages:            # порядок сборки; детали в assembly/sequence.yaml
  - STAGE-1
  - STAGE-2
  - STAGE-3
  - STAGE-4
  - STAGE-5
  - STAGE-6
  - STAGE-7
  - STAGE-8

paths:
  params: params
  components: components
  adr: docs/decisions
  techniques: techniques
  generated: procurement
