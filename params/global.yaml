# Единственный источник габаритов, толщин и объёмов. Источник: исходник §2, §3, §4.1. Единицы: мм, л, кг.
id: PARAMS-global

external_mm: {width: 356, height: 236, depth: 209}
mass_kg_approx: 7.5

materials_thickness_mm:
  mdf: 16
  rear_abs: 5
  front_overlay_abs: 4        # ~4, уточнить по факту закупки
  sealing_bar_section: [16, 20]
  baffle: 16
  feet_protrusion: 10         # боковины выступают ниже дна

internal_mm:
  depth_total: 184            # между внутренними поверхностями передней и задней панелей
  electronics:  {width: 322, height: 194, depth: 58}
  acoustic:     {width: 322, height: 194, depth: 110}

volumes_l:
  acoustic_geometric: 6.87
  acoustic_effective: 5.9
  deductions:
    sealing_bars: 0.30
    driver_basket_and_magnet: 0.50
    terminals_and_wires: 0.15

# Сопоставление: 184 = 58 (электроника) + 16 (перегородка) + 110 (акустика)
# Проверка 209 = 184 + 16 (перед) + 5 (зад) + 4 (накладка)
consistency_notes:
  - "См. OQ-004: размеры боковин (182) и верхней панели (182) vs внутренняя глубина 184; ширина 356 vs 322+2*16=354."

electrical:
  mains_v: "220-250"
  mains_hz: 50
  max_consumption_w: 100
  dc_bus_v: 24
  rms_power_w: {woofer: 40, tweeter_each: 20}

inputs: [stereo_3.5mm, bluetooth_5.0]
frequency_range_hz_minus3db_with_dsp: [60, 20000]
system_sensitivity_db: 88
