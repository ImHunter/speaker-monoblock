# Акустические параметры. Источник: §1.2, §1.4, §8.2.
id: PARAMS-acoustics

enclosure_type: sealed
volume_effective_l: 5.9
qtc: 1.05            # см. OQ-006: расчёт по Qts/Vas даёт ~1.10
fc_hz: 95
f_minus3db_hz:
  without_dsp: [70, 75]
  with_dsp: [60, 65]
dsp_note: "Подъём 45 Гц эквалайзером нецелесообразен: перегрузка диффузора и клиппинг усилителя."

crossover:
  frequency_hz: 2500
  type: Linkwitz-Riley / Butterworth 24 dB/oct   # в DSP реализуется как Butterworth 4-го порядка (OQ-003)

woofer_ref: CMP-wavecor-wf168om01
tweeter_ref: CMP-sica-lp53x58-28-n20tw
amp_ref: CMP-wondom-jab4

sensitivity_db:
  woofer: 88
  tweeter: 95.8
  tweeter_gain_comp_db: -8.0     # 95.8 - 88 = 7.8 → -8

stereo_basis:
  tweeter_x_mm: [50, 306]
  tweeter_spacing_mm: 256
